<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>侯雨佳 | 导航工程 GNSS 与嵌入式</title>
<meta name="description" content="侯雨佳,北华航天工业学院导航工程本科在读。做过 GNSS 上位机、龙芯嵌入式和 PCB 设计。">
<style>
:root{
  --paper:#eef2f5;
  --ink:#14233a;
  --muted:#52627a;
  --line:#c5d0db;
  --signal:#1f5fbf;
  --panel:#e2e9ef;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  line-height:1.8;font-size:17px;
}
a{color:var(--signal);text-underline-offset:3px}
a:focus-visible,summary:focus-visible{outline:3px solid var(--signal);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding:0 24px}

/* 顶部 */
header.top{padding:20px 0;border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px 24px}
header.top strong{font-size:18px;letter-spacing:.08em}
nav a{margin-left:20px;color:var(--ink);text-decoration:none;font-size:15px}
nav a:hover{color:var(--signal);text-decoration:underline}

/* 首屏 */
.hero{padding:56px 0 48px}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
h1{font-size:clamp(34px,6vw,56px);line-height:1.2;margin:0 0 20px;font-weight:700;letter-spacing:.02em}
.lead{font-size:19px;max-width:30em;margin:0 0 8px}
.school{color:var(--muted);margin:0 0 28px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:10px 20px;border:1.5px solid var(--ink);color:var(--ink);text-decoration:none;font-weight:600;border-radius:2px}
.btn.main{background:var(--ink);color:var(--paper)}
.btn:hover{background:var(--signal);border-color:var(--signal);color:#fff}

/* 星空图 */
.sky{width:100%;max-width:380px;justify-self:center}
.sky svg{width:100%;height:auto;display:block}
.sky .ring{fill:none;stroke:var(--line);stroke-width:1.2}
.sky .axis{stroke:var(--line);stroke-width:1}
.sky .dir{fill:var(--muted);font-size:13px;text-anchor:middle}
.sky .sat circle{fill:var(--signal)}
.sky .sat.minor circle{fill:var(--muted)}
.sky .sat text{fill:var(--ink);font-size:13px;font-weight:600}
.sky a:hover circle{fill:var(--ink)}
.sky .note{margin:8px 0 0;font-size:13px;color:var(--muted);text-align:center}

/* 内容 */
section{padding:48px 0;border-top:1px solid var(--line)}
h2{font-size:26px;margin:0 0 28px;line-height:1.3}
.proj{display:grid;grid-template-columns:200px 1fr;gap:12px 40px;padding:28px 0;border-top:1px solid var(--line)}
.proj:first-of-type{border-top:none;padding-top:0}
.proj h3{margin:0;font-size:19px;line-height:1.4}
.proj .tech{margin:6px 0 0;color:var(--muted);font-size:14.5px;line-height:1.6}
.proj ul{margin:0;padding-left:1.2em}
.proj li{margin-bottom:6px;max-width:34em}
.skills{display:grid;grid-template-columns:200px 1fr;gap:14px 40px;margin:0}
.skills dt{font-weight:700}
.skills dd{margin:0;max-width:34em}
.edu{display:grid;grid-template-columns:200px 1fr;gap:6px 40px}
.edu .when{color:var(--muted)}
.edu p{margin:0 0 6px;max-width:34em}

footer{padding:40px 0 56px;border-top:1px solid var(--line);color:var(--muted);font-size:15px}
footer p{margin:0 0 6px}

@media (max-width:760px){
  body{font-size:16px}
  .hero{padding-top:36px}
  .hero .wrap{grid-template-columns:1fr}
  .proj,.skills,.edu{grid-template-columns:1fr;gap:8px}
  nav a{margin:0 16px 0 0}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

<header class="top">
  <div class="wrap">
    <strong>侯雨
